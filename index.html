<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Student Dashboard - VYS Learning Journey" />
    <title>Student Dashboard | VYS Learning Journey</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Orbitron:wght@600;700;800&display=swap');

      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        font-family: 'Nunito', sans-serif;
        color: #f5f7ff;
        background:
          radial-gradient(circle at 10% 10%, rgba(69, 208, 255, .22), transparent 28%),
          radial-gradient(circle at 90% 90%, rgba(138, 92, 246, .28), transparent 30%),
          #070b25;
      }
      main { width: min(100%, 960px); text-align: center; }
      .eyebrow {
        margin: 0 0 12px;
        color: #aef6ff;
        font-size: .8rem;
        font-weight: 800;
        letter-spacing: .18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-family: 'Orbitron', sans-serif;
        font-size: clamp(2rem, 5vw, 3.8rem);
        line-height: 1.2;
      }
      .intro { max-width: 570px; margin: 18px auto 38px; color: #b8c1e6; font-size: 1.05rem; }
      .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
      .card {
        display: flex;
        min-height: 210px;
        flex-direction: column;
        justify-content: flex-end;
        padding: 25px;
        overflow: hidden;
        border: 1px solid rgba(147, 170, 255, .3);
        border-radius: 22px;
        color: inherit;
        text-align: left;
        text-decoration: none;
        background: linear-gradient(145deg, rgba(38, 52, 121, .9), rgba(16, 22, 62, .9));
        box-shadow: 0 18px 45px rgba(0, 0, 0, .25);
        transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
      }
      .card:nth-child(2) { background: linear-gradient(145deg, rgba(98, 48, 139, .9), rgba(25, 20, 65, .9)); }
      .card:nth-child(3) { background: linear-gradient(145deg, rgba(25, 110, 120, .9), rgba(12, 34, 69, .9)); }
      .card:hover, .card:focus-visible {
        transform: translateY(-6px);
        border-color: #71e6ff;
        box-shadow: 0 24px 50px rgba(0, 0, 0, .38);
        outline: none;
      }
      .number { margin: 0 0 auto; color: #aef6ff; font-family: 'Orbitron', sans-serif; font-size: .78rem; }
      .name { margin: 0; font-family: 'Orbitron', sans-serif; font-size: 1.45rem; }
      .open { margin: 10px 0 0; color: #d9e0ff; font-weight: 700; }
      footer { margin-top: 30px; color: #8994c1; font-size: .9rem; }
      @media (max-width: 700px) { .cards { grid-template-columns: 1fr; } .card { min-height: 160px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">VYS Learning Journey</p>
      <h1>Student Dashboard</h1>
      <p class="intro">Chọn hồ sơ để xem hành trình học tập của từng thành viên.</p>
      <nav class="cards" aria-label="Danh sách học viên">
        <a class="card" href="Dat-home.html">
          <p class="number">01</p><h2 class="name">Đình Đạt</h2><p class="open">Xem dashboard →</p>
        </a>
        <a class="card" href="Trinh-home.html">
          <p class="number">02</p><h2 class="name">Thái Diễm Trinh</h2><p class="open">Xem dashboard →</p>
        </a>
        <a class="card" href="Minh-home.html">
          <p class="number">03</p><h2 class="name">Quang Minh</h2><p class="open">Xem dashboard →</p>
        </a>
      </nav>
      <footer>Chọn một dashboard để bắt đầu.</footer>
    </main>
  </body>
</html>
